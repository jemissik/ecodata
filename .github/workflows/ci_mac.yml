name: ci_mac
on:
  pull_request:
    branches:
      - annotation
      - main

jobs:
  pre_job:
    runs-on: ubuntu-latest
    # Map a step output to a job output
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          # All of these options are optional, so you can remove them if you are happy with the defaults
          concurrent_skipping: 'same_content_newer'
          skip_after_successful_duplicate: 'true'
          paths_ignore: '["**/README.md", "**/docs/**"]'
          do_not_skip: '["workflow_dispatch", "schedule"]'

  pytest:
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Miniforge
        uses: conda-incubator/setup-miniconda@v4
        with:
            miniforge-version: latest
            channels: conda-forge
            conda-remove-defaults: true
            channel-priority: strict
            conda-solver: libmamba
            auto-update-conda: true
            activate-environment: eco-dev
            environment-file: ecodata-env.yml

      - name: Add development dependencies
        shell: bash -el {0}
        run: conda env update -n eco-dev -f ecodata-dev-env.yml --solver libmamba

      - name: Install ecodata editable
        shell: bash -el {0}
        run: conda run --no-capture-output -n eco-dev python -m pip install --no-deps -e .

      - name: Run tests
        shell: bash -el {0}
        run: conda run --no-capture-output -n eco-dev python -m pytest -s
