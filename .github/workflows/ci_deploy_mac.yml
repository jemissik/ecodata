name: ci_deploy_mac
on:
  pull_request:
    branches:
      - annotation
      - main

jobs:
  pre_job:
    runs-on: ubuntu-latest
    # Map a step output to a job output
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          # All of these options are optional, so you can remove them if you are happy with the defaults
          concurrent_skipping: 'same_content_newer'
          skip_after_successful_duplicate: 'true'
          paths_ignore: '["**/README.md", "**/docs/**"]'
          do_not_skip: '["workflow_dispatch", "schedule"]'

  deploy_test:
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Miniforge
        uses: conda-incubator/setup-miniconda@v4
        with:
            miniforge-version: latest
            channels: conda-forge
            conda-remove-defaults: true
            channel-priority: strict
            conda-solver: libmamba
            auto-update-conda: true
            activate-environment: eco-runtime
            environment-file: ecodata-env.yml

      - name: Install package
        shell: bash -el {0}
        run: conda run --no-capture-output -n eco-runtime python -m pip install --no-deps .

      - name: Test installed package
        shell: bash -el {0}
        working-directory: ${{ runner.temp }}
        run: conda run --no-capture-output -n eco-runtime python -c "import ecodata; from ecodata.app.apps import applications; print('Installed ecodata:', getattr(ecodata, '__version__', 'unknown'), ecodata.__file__); print('Registered apps:', ', '.join(sorted(applications))); assert applications"
