name: conda_constructor
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of Release'
        required: true

jobs:
    Unix-like:
        name: ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    # UBUNTU
                    -   os: ubuntu-latest
                        ARCH: x86_64
                        OS_NAME: "Linux"
                    # x86_64 MACOS
                    -   os: macos-13
                        ARCH: x86_64
                        OS_NAME: "MacOSX"
#                    # ARM MACOS
#                    -   os: macos-14
#                        ARCH: arm64
#                        OS_NAME: "MacOSX"
        env:
            PYTHONUNBUFFERED: True
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Setup Mambaforge
              uses: conda-incubator/setup-miniconda@v2
              with:
                  miniforge-variant: Mambaforge
                  miniforge-version: latest
                  use-mamba: true
                  activate-environment: constructor

            - name: Install constructor
              shell: bash -l {0}
              run: |
                conda install constructor -y
                conda install -c conda-forge jinja2 -y

            - name: Run conda constructor
              shell: bash -l {0}
              run: |
                    cd scripts
                    bash build.sh
            - name: upload artifacts
              uses: actions/upload-artifact@v3
              with:
                path: scripts/ecodata*
                name: ecodata-${{ matrix.OS_NAME }}-${{ matrix.ARCH }}

            -   name: Upload binaries to release
                uses: svenstaro/upload-release-action@v2
                with:
                    repo_token: ${{ secrets.GITHUB_TOKEN }}
                    file: scripts/ecodata*
                    tag: ${{ inputs.tag }}
                    overwrite: true
                    file_glob: true

    Windows:
        name: ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    # WINDOWS
                    -   os: windows-latest
                        ARCH: x86_64
                        OS_NAME: "Windows"
        env:
            PYTHONUNBUFFERED: True
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Setup Mambaforge
              uses: conda-incubator/setup-miniconda@v3
              with:
                  auto-update-conda: true

            - name: Install constructor
              run: |
                conda install constructor -y
                conda install -c conda-forge jinja2 -y

            - name: Run conda constructor
              run: |
                    cd scripts
                    .\build.ps1
            - name: upload artifacts
              uses: actions/upload-artifact@v3
              with:
                path: scripts/ecodata*
                name: ecodata-${{ matrix.OS_NAME }}-${{ matrix.ARCH }}

            -   name: Upload binaries to release
                uses: svenstaro/upload-release-action@v2
                with:
                    repo_token: ${{ secrets.GITHUB_TOKEN }}
                    file: scripts/ecodata*
                    tag: ${{ inputs.tag }}
                    overwrite: true
                    file_glob: true
