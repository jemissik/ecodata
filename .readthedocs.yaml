version: 2

sphinx:
  configuration: docs/conf.py

build:
  os: "ubuntu-24.04"
  tools:
    python: "miniforge3-26.3"
  jobs:
    pre_create_environment:
      - conda config --set channel_priority strict
      - conda config --set solver libmamba
      - conda config --show channels channel_priority solver
    post_install:
      - conda env update --name ${READTHEDOCS_VERSION} --file ecodata-dev-env.yml --solver libmamba
      - python -m pip install --no-deps -e .
      - conda list

conda:
 environment: ecodata-env.yml

# Build all downloadable formats
formats: all
